# Vale prose lint for the marketing site and app HTML.
# Enforces the hard constraints in CLAUDE.md. Run from the repo root:
#   vale --config tests/site-quality/vale.ini .
StylesPath = vale-styles
MinAlertLevel = warning

[*.html]
BasedOnStyles = FitzHR

# LinkedIn is named here only as a third-party service (a job board customers
# post to, and an example in the privacy policy), not as a Fitz HR channel.
# The workflow separately fails on any linkedin.com URL anywhere on the site.
[{app,privacy}.html]
FitzHR.LinkedIn = NO
